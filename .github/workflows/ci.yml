name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sandbox host tools (bubblewrap + uv, M5)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Core tests (no frontend compiled)
        run: cargo test -p agent-core
      - name: "Full test suite (offline: fake provider, no network)"
        run: cargo test
      - name: Release build (single-binary check)
        run: cargo build --release

  # The frog frontend (ADR-031) needs GTK4 + gtk4-layer-shell, which the
  # headless main job deliberately skips (it is not in `default-members`).
  # ubuntu-latest has GTK4 but not gtk4-layer-shell, so build that from source.
  frog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: GTK4 + gtk4-layer-shell (host libraries)
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-4-dev meson ninja-build
          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
      - name: Lint (frog)
        run: cargo clippy -p agent-frog --all-targets -- -D warnings
      - name: Test (frog, offline)
        run: cargo test -p agent-frog
