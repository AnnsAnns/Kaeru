[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-server",
    "crates/agent-daemon",
    "crates/agent-frog",
]
# The GUI frontend needs GTK4 + gtk4-layer-shell, which CI and headless hosts do
# not necessarily have. Keep it a workspace member (shared lockfile + `-p
# agent-frog`) but out of the default build set, so `cargo test`/`cargo build`
# stay headless-friendly (ADR-031). Build it explicitly with `-p agent-frog`.
default-members = ["crates/agent-core", "crates/agent-server", "crates/agent-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
agent-server = { path = "crates/agent-server" }
async-channel = "2"
axum = "0.8"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
http-body-util = "0.1"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
