<!doctype html>
<html lang="en" data-theme="latenightbath">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>蛙🐸💭</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <header class="box topbar">
      <button id="threads-btn" class="icon-btn" type="button" title="Threads"
        aria-label="Threads" aria-expanded="false">🧵</button>
      <h1 class="app-name">Kaeru <span id="frog-home" class="frog-slot"></span></h1>
      <span id="fake-badge" class="badge fake-badge" hidden>fake</span>
      <div class="topbar-actions">
        <button id="todo-btn" class="icon-btn" type="button" title="TODO lists"
          aria-label="TODO lists" aria-expanded="false">✅</button>
        <button id="memory-btn" class="icon-btn" type="button" title="Memory"
          aria-label="Memory" aria-expanded="false">🗒️</button>
        <button id="settings-btn" class="icon-btn" type="button" title="Settings"
          aria-label="Settings" aria-expanded="false">⚙️</button>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <div id="backdrop" class="backdrop" hidden></div>

      <aside id="sidebar" class="box sidebar" aria-label="Threads">
        <div class="box-title">
          <span class="title-label">Threads</span>
          <button class="panel-close" type="button" data-close aria-label="Close threads">✕</button>
        </div>
        <button id="new-thread-btn" class="action-btn new-thread" type="button">+ new thread</button>
        <ul id="thread-list" class="thread-list"></ul>
      </aside>

      <main id="messages" aria-live="polite" aria-label="Chat"></main>

      <aside id="memory-panel" class="box memory-panel" aria-label="Memory">
        <div class="box-title">
          <span class="title-label">Memory</span>
          <button class="panel-close" type="button" data-close aria-label="Close memory">✕</button>
        </div>
        <form id="memory-search" class="memory-search">
          <input id="memory-query" type="search" placeholder="search memory…"
            autocomplete="off" spellcheck="false" aria-label="Search memory">
          <button type="submit" class="action-btn">find</button>
        </form>
        <button id="reflect-btn" class="action-btn reflect-now" type="button"
          title="Digest today's conversations into memory now (M4.5)">🌙 reflect now</button>
        <p id="reflect-status" class="memory-empty" hidden></p>
        <p id="memory-empty" class="memory-empty" hidden>no notes yet — ask kaeru to remember something</p>
        <ul id="memory-list" class="memory-list"></ul>
      </aside>

      <aside id="todo-panel" class="box todo-panel" aria-label="TODO lists">
        <div class="box-title">
          <span class="title-label">TODO</span>
          <button class="panel-close" type="button" data-close aria-label="Close TODO">✕</button>
        </div>
        <form id="todo-new-list" class="todo-new-list">
          <input id="todo-new-list-input" type="text" placeholder="new list…"
            autocomplete="off" spellcheck="false" aria-label="New list title">
          <button type="submit" class="action-btn">add list</button>
        </form>
        <p id="todo-empty" class="memory-empty" hidden>no lists yet — add one above</p>
        <label class="todo-list-wrap">
          <span class="visually-hidden">List</span>
          <select id="todo-list-select" class="chip todo-list-select" hidden></select>
        </label>
        <form id="todo-new-item" class="todo-new-item" hidden>
          <input id="todo-new-item-input" type="text" placeholder="new item…"
            autocomplete="off" spellcheck="true" aria-label="New item">
          <button type="submit" class="action-btn">add</button>
        </form>
        <ul id="todo-items" class="todo-items"></ul>
      </aside>

      <aside id="settings-panel" class="box settings-panel" aria-label="Settings">
        <div class="box-title">
          <span class="title-label">Settings</span>
          <button class="panel-close" type="button" data-close aria-label="Close settings">✕</button>
        </div>
        <label class="field">
          <span class="field-label">Model</span>
          <select id="model-select" class="chip model-chip" title="Model for the next message"></select>
        </label>
        <label class="field">
          <span class="field-label">Reasoning effort</span>
          <select id="effort-select" class="chip model-chip" title="Reasoning effort for the next message" hidden></select>
        </label>
        <button id="theme-btn" class="chip theme-chip" type="button" title="Cycle theme">
          🎨 <span id="theme-name">latenightbath</span>
        </button>
        <span id="usage-badge" class="badge usage-badge" hidden></span>
      </aside>
    </div>

    <footer class="box composer-box">
      <div class="box-title">
        <span class="title-label" id="composer-label">Ponder at the Pond 💭</span>
        <span class="title-chrome" aria-hidden="true">➖ ⏹️ ❌</span>
      </div>
      <div id="attachments" class="attachments" hidden></div>
      <div class="composer-row">
        <span id="frog-desk" class="frog-slot"></span>
        <textarea id="composer" rows="1" placeholder="talk to the frogs…"
          enterkeyhint="send" autocomplete="off" spellcheck="true"></textarea>
        <div class="composer-side" role="group" aria-label="Answer actions">
          <button id="regen-btn" class="side-btn" type="button"
            title="Regenerate the last answer" aria-label="Regenerate the last answer">↻</button>
          <button id="attach-btn" class="side-btn" type="button"
            title="Upload a file into the workspace" aria-label="Attach a file">📎</button>
        </div>
        <input id="file-input" type="file" hidden>
        <button id="send-btn" class="action-btn" type="button" title="Send (enter)">Ponder</button>
        <button id="stop-btn" class="action-btn stop" type="button" title="Stop generating" hidden>stop</button>
      </div>
    </footer>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
