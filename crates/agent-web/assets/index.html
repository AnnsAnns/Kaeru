<!doctype html>
<html lang="en" data-theme="latenightbath">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>蛙🐸💭</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <header class="box header-box">
      <div class="box-title">
        <span class="title-label">Settings</span>
        <span class="title-chrome" aria-hidden="true">➖ ⏹️ ❌</span>
      </div>
      <h1 class="app-name">Kaeru 🐸</h1>
      <div class="header-controls">
        <button id="threads-btn" class="chip" type="button" title="Toggle threads" aria-expanded="false">🧵 Threads</button>
        <button id="theme-btn" class="chip" type="button" title="Cycle theme">
          <span aria-hidden="true">🎨 Theme:</span> <br /> <span id="theme-name">latenightbath</span>
        </button>
        <label class="model-wrap">
          <span class="visually-hidden">Model</span>
          <select id="model-select" class="chip model-chip" title="Model for the next message"></select>
        </label>
        <span id="fake-badge" class="chip fake-badge" hidden>fake provider</span>
        <span id="usage-badge" class="chip usage-badge" hidden></span>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <aside id="sidebar" class="box sidebar" aria-label="Threads">
        <div class="box-title">
          <span class="title-label">Threads</span>
          <span class="title-chrome" aria-hidden="true">➖ ⏹️ ❌</span>
        </div>
        <button id="new-thread-btn" class="action-btn new-thread" type="button">+ new thread</button>
        <ul id="thread-list" class="thread-list"></ul>
      </aside>

      <main id="messages" aria-live="polite" aria-label="Chat"></main>
    </div>

    <footer class="box composer-box">
      <div class="box-title">
        <span class="title-label" id="composer-label">Ponder at the Pond 💭</span>
        <span class="title-chrome" aria-hidden="true">➖ ⏹️ ❌</span>
      </div>
      <div class="composer-row">
        <textarea id="composer" rows="1" placeholder="talk to the frogs…"
          enterkeyhint="send" autocomplete="off" spellcheck="true"></textarea>
        <button id="send-btn" class="action-btn" type="button" title="Send (enter)">Ponder</button>
        <button id="stop-btn" class="action-btn stop" type="button" title="Stop generating" hidden>stop</button>
      </div>
    </footer>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
