<!doctype html>
<html lang="en" data-theme="latenightbath">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>kaeru</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <header class="box header-box">
      <div class="box-title">
        <span class="title-label">kaeru</span>
        <span class="title-chrome" aria-hidden="true">➖ ⏹️ ❌</span>
      </div>
      <h1 class="app-name">kaeru</h1>
      <div class="header-controls">
        <button id="theme-btn" class="chip" type="button" title="Cycle theme">
          <span aria-hidden="true">🎨</span> <span id="theme-name">latenightbath</span>
        </button>
        <label class="model-wrap">
          <span class="visually-hidden">Model</span>
          <select id="model-select" class="chip model-chip" title="Model for the next message"></select>
        </label>
        <span id="fake-badge" class="chip fake-badge" hidden>fake provider</span>
      </div>
    </header>

    <main id="messages" aria-live="polite" aria-label="Chat"></main>

    <footer class="box composer-box">
      <div class="box-title">
        <span class="title-label" id="composer-label">say something</span>
        <span class="title-chrome" aria-hidden="true">➖ ⏹️ ❌</span>
      </div>
      <div class="composer-row">
        <textarea id="composer" rows="1" placeholder="talk to kaeru…"
          enterkeyhint="send" autocomplete="off" spellcheck="true"></textarea>
        <button id="send-btn" class="action-btn" type="button" title="Send (enter)">send</button>
        <button id="stop-btn" class="action-btn stop" type="button" title="Stop generating" hidden>stop</button>
      </div>
    </footer>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
